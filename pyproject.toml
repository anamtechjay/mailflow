[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailflow"
version = "0.1.0"
description = "Provider- and transport-agnostic email ingestion toolkit (core spine)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["mypy>=1.9"]
graph = ["msal>=1.28", "httpx>=0.27", "azure-eventhub>=5.11", "azure-eventhub-checkpointstoreblob>=1.1", "azure-storage-blob>=12.19", "azure-identity>=1.16"]
gmail = ["httpx>=0.27", "google-auth>=2.30", "google-api-python-client>=2.130", "google-cloud-pubsub>=2.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow"]

[tool.mypy]
mypy_path = "src"
packages = ["mailflow"]
python_version = "3.12"
strict = true

# Optional `graph`-extra SDKs: imported only locally inside live.py. They ship no
# stubs and are absent from the unit-test environment, so don't fail strict mode on
# missing imports for them.
[[tool.mypy.overrides]]
module = ["msal", "httpx", "azure.*", "google.*"]
ignore_missing_imports = true
