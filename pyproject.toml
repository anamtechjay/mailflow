[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailflow"
version = "0.1.0"
description = "Provider- and transport-agnostic email ingestion toolkit (core spine)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6,<3"]

[project.scripts]
mailflow = "mailflow.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.9,<2", "pytest>=8,<9", "hypothesis>=6,<7"]
graph = ["msal>=1.28,<2", "httpx>=0.27,<1", "azure-eventhub>=5.11,<6", "azure-eventhub-checkpointstoreblob>=1.1,<2", "azure-storage-blob>=12.19,<13", "azure-identity>=1.16,<2"]
gmail = ["httpx>=0.27,<1", "google-auth>=2.30,<3", "google-auth-oauthlib>=1.2,<2", "google-api-python-client>=2.130,<3", "google-cloud-pubsub>=2.21,<3"]
servicebus = ["azure-servicebus>=7.12,<8", "azure-identity>=1.16,<2"]
postgres = ["psycopg[binary]>=3.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: allocates large buffers / processes bulk volumes; excluded from the default fast run (-m \"not slow\")",
    "live: requires a real external dependency (provider credentials, network, subprocess against a live service); gated, run explicitly via -m live",
    "reliability: exercises multi-run/redelivery reliability semantics (dedupe/cursor/DLQ) end to end",
]

[tool.mypy]
mypy_path = "src"
packages = ["mailflow"]
python_version = "3.12"
strict = true

# Optional `graph`-extra SDKs: imported only locally inside live.py. They ship no
# stubs and are absent from the unit-test environment, so don't fail strict mode on
# missing imports for them.
[[tool.mypy.overrides]]
module = ["msal", "httpx", "azure.*", "google.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true
